name: release

# Publishing is driven by a tag: push `v0.1.0` and this workflow creates the GitHub
# Release from CHANGELOG.md.
#
# npm publishing additionally needs an automation token with 2FA bypass enabled, stored
# as the repository secret `NPM_TOKEN`. It is read into an environment variable at job
# level, because `secrets.*` is not available inside a step-level `if`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "tag and package.json agree on $version"

      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Test
        working-directory: tests
        run: |
          npm ci
          npm test

      - name: Pack
        run: npm pack --dry-run

      - name: Extract this version's changelog notes
        run: node scripts/release-notes.mjs

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish
